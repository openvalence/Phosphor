[package]
name = "phosphor"
version = "0.1.0"
description = "Phosphor - the Valence client shell"
authors = ["AtlanticTM"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# devtools in release: alpha builds are inspected in the field (Ctrl+Shift+I); drop before beta.
tauri = { version = "2.11.3", features = ["devtools"] }
tauri-plugin-log = "2"
# Rust-side fetch: /uitoken minting from a native origin (main.js shell branch)
tauri-plugin-http = "2"
# BLE central (RFC-043 client side): btleplug on desktop, native Kotlin on Android.
# Also asks Android's Bluetooth permission before a toy scan (bp_scan_start).
tauri-plugin-blec = "0.12"
# Plugin TCP line service (src/plugins.rs). Already in the tree via tauri;
# named here only to enable net + io-util, and time for the buttplug
# server's timed scan and client rate (src/buttplug.rs).
tokio = { version = "1", features = ["net", "io-util", "rt", "sync", "macros", "time"] }
# Every IPv4 interface's address and prefix for the datagram e-stop
# (src/estop_udp.rs, RFC-053): std has no interface list. The ButtplugIO fork
# already builds this version.
if-addrs = "0.14"

# Embedded buttplug server (src/buttplug.rs, docs/BUTTPLUG.md): path deps on the
# fork beside this repo, branch `valence`. Desktop and Android; serial and HID
# toys are desktop only.
[target.'cfg(not(target_os = "ios"))'.dependencies]
buttplug_core = { path = "../../ButtplugIO/crates/buttplug_core" }
buttplug_server = { path = "../../ButtplugIO/crates/buttplug_server" }
buttplug_server_device_config = { path = "../../ButtplugIO/crates/buttplug_server_device_config" }
buttplug_transport_websocket_tungstenite = { path = "../../ButtplugIO/crates/buttplug_transport_websocket_tungstenite" }
buttplug_server_hwmgr_btleplug = { path = "../../ButtplugIO/crates/buttplug_server_hwmgr_btleplug" }
async-trait = "0.1"
futures = "0.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
buttplug_server_hwmgr_serial = { path = "../../ButtplugIO/crates/buttplug_server_hwmgr_serial" }
buttplug_server_hwmgr_hid = { path = "../../ButtplugIO/crates/buttplug_server_hwmgr_hid" }

# Toy BLE on Android is btleplug's own backend: its init (JNI_OnLoad, lib.rs)
# takes jni 0.19's JNIEnv, and the runtime that attaches every thread to the JVM
# needs rt-multi-thread (src/buttplug.rs, mod android). Its Java half is built
# by src-tauri/android/btleplug.
[target.'cfg(target_os = "android")'.dependencies]
btleplug = "0.12"
jni = "0.19"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tokio-tungstenite = "0.30"

# Vendored 0.12.0 + panic-across-JNI fix (Android notify/event channels used
# expect() on the binder thread — a dropped receiver aborted the whole app).
# build.rs also declares `mtu` and `set_android_mtu`, which upstream omits, so
# no permission exists to allow them (SPEC 13.4 MTU).
# Upstream issue pending; drop this patch when a fixed release ships.
[patch.crates-io]
tauri-plugin-blec = { path = "vendor/tauri-plugin-blec" }
