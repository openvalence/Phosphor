# Phosphor bundles for Windows, macOS and Linux, plus a Flatpak built from
# the Linux .deb, a Windows MSIX and an Android APK. A v* tag opens a draft
# release holding every bundle; once Azure Artifact Signing is configured it
# signs the Windows exe, installer and MSIX first. docs/BUILD.md is the map.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # the draft release on a tag

jobs:
  bundle:
    name: ${{ matrix.triple }}
    permissions:
      contents: write
      id-token: write # Azure login (OIDC) for Windows signing
    # Windows signing runs on v* tag pushes once vars.AZURE_ARTIFACT_SIGNING_ACCOUNT is
    # set (docs/BUILD.md, Windows signing); otherwise its steps are skipped.
    # Do not name it SIGN: linuxdeploy-plugin-appimage gpg-signs the AppImage
    # when SIGN is set to any value, "false" included, and the Linux bundle fails.
    env:
      WINDOWS_SIGN: ${{ matrix.os == 'windows-latest' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.AZURE_ARTIFACT_SIGNING_ACCOUNT != '' }}
    # The federated credential trusts this environment, which admits v* tags only.
    environment: ${{ matrix.os == 'windows-latest' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.AZURE_ARTIFACT_SIGNING_ACCOUNT != '' && 'windows-signing' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-latest
            triple: aarch64-apple-darwin
            bundles: app,dmg
          - os: ubuntu-22.04 # oldest glibc the AppImage and .deb support
            triple: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      # The sibling layout Phosphor builds against: Valence (the JS client),
      # Nucleus and Kinetic (the built-in machine's sources, pinned in
      # src/model/neutrino/neutrino.pin and vendored), ButtplugIO (Cargo path
      # deps), all beside Phosphor.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: Phosphor
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: openvalence/Nucleus
          path: Nucleus
      - name: Valence at Nucleus's valence.pin
        id: pin
        shell: bash
        run: echo "sha=$(tr -d '[:space:]' < Nucleus/valence.pin)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: openvalence/Valence
          ref: ${{ steps.pin.outputs.sha }}
          path: Valence
      - name: Kinetic at Nucleus's kinetic.pin
        id: kpin
        shell: bash
        run: echo "sha=$(tr -d '[:space:]' < Nucleus/kinetic.pin)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: openvalence/Kinetic
          ref: ${{ steps.kpin.outputs.sha }}
          path: Kinetic
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: openvalence/ButtplugIO
          ref: valence
          path: ButtplugIO

      - name: Linux packages (Tauri's GTK/WebKit, buttplug's udev/usb/dbus)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libudev-dev libusb-1.0-0-dev libdbus-1-dev

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Phosphor/package-lock.json
      - run: npm ci
        working-directory: Phosphor
      - name: Stamp the build version (docs/BUILD.md, Versioning)
        run: node tools/version.mjs --write
        working-directory: Phosphor
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: Phosphor/src-tauri -> target

      # macOS: ad-hoc signed ("-"), no Apple ID. Notarizing needs the APPLE_*
      # secrets (docs/BUILD.md).
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        if: runner.os != 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          projectPath: Phosphor
          args: --target ${{ matrix.triple }} --bundles ${{ matrix.bundles }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: Phosphor ${{ github.ref_name }}
          releaseDraft: true

      # Windows builds, then bundles, so signing starts minutes after the
      # Azure login (its OIDC assertion expires soon after). Tauri patches the
      # bundle type into phosphor.exe while packing NSIS, so Tauri's
      # signCommand (tools/sign-windows.ps1) signs the patched exe, the
      # uninstaller and the installer; the action then signs the restored exe
      # that the portable zip and MSIX carry. windows-release publishes them.
      - name: Build phosphor.exe
        if: runner.os == 'Windows'
        shell: bash
        working-directory: Phosphor
        run: npx tauri build --target ${{ matrix.triple }} --no-bundle
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: env.WINDOWS_SIGN == 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: ArtifactSigning module for the signCommand
        if: env.WINDOWS_SIGN == 'true'
        shell: pwsh
        run: Install-Module -Name ArtifactSigning -RequiredVersion 0.1.8 -Force -Repository PSGallery
      - name: NSIS installer
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: Phosphor
        env:
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
        run: |
          $conf = @()
          if ($env:WINDOWS_SIGN -eq 'true') {
            $sign = @{ bundle = @{ windows = @{ signCommand = @{ cmd = 'pwsh'; args = @('-NoProfile', '-File', "$PWD\tools\sign-windows.ps1", '%1') } } } }
            $sign | ConvertTo-Json -Depth 6 | Set-Content "$env:RUNNER_TEMP\sign.json"
            $conf = @('--config', "$env:RUNNER_TEMP\sign.json")
          }
          npx tauri bundle --target ${{ matrix.triple }} --bundles nsis @conf
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Sign phosphor.exe
        if: env.WINDOWS_SIGN == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\Phosphor\src-tauri\target\${{ matrix.triple }}\release\phosphor.exe

      # The .app ships inside the .dmg: an artifact zip drops its exec bits.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: phosphor-${{ matrix.triple }}
          if-no-files-found: error
          path: |
            Phosphor/src-tauri/target/${{ matrix.triple }}/release/bundle/nsis/*.exe
            Phosphor/src-tauri/target/${{ matrix.triple }}/release/bundle/dmg/*.dmg
            Phosphor/src-tauri/target/${{ matrix.triple }}/release/bundle/deb/*.deb
            Phosphor/src-tauri/target/${{ matrix.triple }}/release/bundle/appimage/*.AppImage

      # The plain built exe: the frontend is embedded, no resources or sidecars.
      # It needs the WebView2 runtime. Named after the installer's version.
      # The published asset is portable-zip/*.zip, a Phosphor/ folder holding
      # phosphor.exe and the phosphor.portable marker (docs/DESIGN.md 10.18).
      - name: Portable zip
        if: runner.os == 'Windows'
        shell: bash
        working-directory: Phosphor/src-tauri/target/${{ matrix.triple }}/release
        run: |
          setup=$(ls bundle/nsis/Phosphor_*_x64-setup.exe)
          v=$(basename "$setup" | sed -E 's/^Phosphor_(.+)_x64-setup\.exe$/\1/')
          mkdir -p portable-stage/Phosphor portable-zip
          cp phosphor.exe portable-stage/Phosphor/phosphor.exe
          echo "Phosphor portable mode: all data stays in PhosphorData beside phosphor.exe." > portable-stage/Phosphor/phosphor.portable
          (cd portable-stage && 7z a -tzip "../portable-zip/Phosphor_${v}_x64-portable.zip" Phosphor)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'Windows'
        with:
          name: phosphor-${{ matrix.triple }}-portable
          if-no-files-found: error
          path: Phosphor/src-tauri/target/${{ matrix.triple }}/release/portable-zip/*.zip

      # The sideload MSIX around the same exe. Its Publisher must equal the
      # signing certificate's subject (vars.MSIX_PUBLISHER) or signing fails;
      # unsigned, it does not install, so only the signed one goes into a release.
      # Allowed to fail until it has passed on a GitHub runner (makeappx on windows-latest is unproven).
      - name: MSIX package
        id: msix
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        working-directory: Phosphor
        env:
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
        run: |
          rel=src-tauri/target/${{ matrix.triple }}/release
          node tools/msix/pack.mjs --exe-dir "$rel"
          v=$(basename "$rel"/bundle/nsis/Phosphor_*_x64-setup.exe | sed -E 's/^Phosphor_(.+)_x64-setup\.exe$/\1/')
          mkdir -p "$rel/msix" && cp src-tauri/target/msix/phosphor-x86_64.msix "$rel/msix/Phosphor_${v}_x64.msix"
      - name: Sign the MSIX
        if: env.WINDOWS_SIGN == 'true' && steps.msix.outcome == 'success'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\Phosphor\src-tauri\target\${{ matrix.triple }}\release\msix
          files-folder-filter: msix
      - name: Verify the signatures
        if: env.WINDOWS_SIGN == 'true'
        shell: pwsh
        working-directory: Phosphor/src-tauri/target/${{ matrix.triple }}/release
        run: |
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          # The installed exe, unpacked from the installer (7-Zip reads NSIS).
          $setup = Get-Item bundle/nsis/*-setup.exe
          7z e $setup.FullName phosphor.exe "-o$env:RUNNER_TEMP\installed" -y | Out-Null
          $files = @(Get-Item phosphor.exe, $setup, "$env:RUNNER_TEMP\installed\phosphor.exe") + @(Get-ChildItem msix/*.msix -ErrorAction SilentlyContinue)
          $bad = 0
          foreach ($f in $files) {
            & $signtool verify /pa /q $f.FullName
            $ok = $LASTEXITCODE -eq 0
            $s = Get-AuthenticodeSignature $f.FullName
            "{0}: {1}; signer {2}; timestamp {3}" -f $f.Name, ($ok ? 'verified' : 'FAILED'), $s.SignerCertificate.Subject, $s.TimeStamperCertificate.Subject
            if (-not $ok) { $bad++ }
          }
          if ($bad) { Write-Error "$bad file(s) failed signtool verify /pa"; exit 1 }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'Windows' && steps.msix.outcome == 'success'
        with:
          name: phosphor-${{ matrix.triple }}-msix
          if-no-files-found: error
          path: Phosphor/src-tauri/target/${{ matrix.triple }}/release/msix/*.msix

  # After bundle: tauri-action opens the draft release in the macOS and Linux
  # jobs. The installer and portable zip always; the MSIX only when signed.
  windows-release:
    needs: bundle
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: phosphor-x86_64-pc-windows-msvc*
          path: win
      - name: Windows files into the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNED: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT != '' }}
        run: |
          shopt -s nullglob
          files=(win/phosphor-x86_64-pc-windows-msvc/nsis/*-setup.exe win/phosphor-x86_64-pc-windows-msvc-portable/*.zip)
          msix=(win/phosphor-x86_64-pc-windows-msvc-msix/*.msix)
          if [ "$SIGNED" = true ]; then
            [ ${#msix[@]} -gt 0 ] || echo "::warning::no MSIX: the MSIX package step failed"
            files+=("${msix[@]}")
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber -R "$GITHUB_REPOSITORY"

  # The sideload APK, arm64-v8a only (docs/BUILD.md, Android release). Signed
  # when the ANDROID_KEYSTORE_* secrets exist; pull requests and forks get an
  # unsigned APK on purpose.
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: Phosphor
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: openvalence/Nucleus
          path: Nucleus
      - name: Valence at Nucleus's valence.pin
        id: pin
        run: echo "sha=$(tr -d '[:space:]' < Nucleus/valence.pin)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: openvalence/Valence
          ref: ${{ steps.pin.outputs.sha }}
          path: Valence
      - name: Kinetic at Nucleus's kinetic.pin
        id: kpin
        run: echo "sha=$(tr -d '[:space:]' < Nucleus/kinetic.pin)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: openvalence/Kinetic
          ref: ${{ steps.kpin.outputs.sha }}
          path: Kinetic
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: openvalence/ButtplugIO
          ref: valence
          path: ButtplugIO

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;29.0.14206865
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Phosphor/package-lock.json
      - run: npm ci
        working-directory: Phosphor
      - run: rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: Phosphor/src-tauri -> target

      - name: Release keystore from the secrets, or an unsigned build
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "PHOSPHOR_ANDROID_UNSIGNED=1" >> "$GITHUB_ENV"
          fi
      - name: Release APK
        working-directory: Phosphor
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          npx tauri android init --ci
          npm run build:android -- --apk --target aarch64 --ci
      - name: Name the APK after the build version; verify the signature
        working-directory: Phosphor
        run: |
          v=$(node tools/version.mjs)
          out=src-tauri/gen/android/app/build/outputs/apk/universal/release
          mkdir -p apk
          if [ -f "$out/app-universal-release.apk" ]; then
            cp "$out/app-universal-release.apk" "apk/Phosphor_${v}_android-arm64.apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs apk/*.apk
          else
            cp "$out/app-universal-release-unsigned.apk" "apk/Phosphor_${v}_android-arm64-unsigned.apk"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phosphor-android-arm64
          if-no-files-found: error
          path: Phosphor/apk/*.apk

  # After bundle: tauri-action opens the draft release there. Unsigned APKs never ship.
  android-release:
    needs: [bundle, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: phosphor-android-arm64
          path: apk
      - name: Signed APK into the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ls apk/*-unsigned.apk >/dev/null 2>&1; then
            echo "::error::the APK is unsigned: set ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD (docs/BUILD.md, Android release)"
            exit 1
          fi
          gh release upload "${{ github.ref_name }}" apk/*.apk --clobber -R "${{ github.repository }}"

  flatpak:
    needs: bundle
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: phosphor-x86_64-unknown-linux-gnu
          path: linux
      - name: Hand the .deb to the manifest; its name carries the build version
        run: |
          deb=$(ls linux/deb/*.deb); cp "$deb" flatpak/phosphor.deb
          v=$(basename "$deb" | sed -E 's/^Phosphor_([0-9.]+)_.*/\1/')
          sed -i -E "s|<release version=\"[^\"]+\" date=\"[^\"]+\"/>|<release version=\"$v\" date=\"$(date -u +%F)\"/>|" flatpak/org.openvalence.Phosphor.metainfo.xml
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: flatpak/org.openvalence.Phosphor.yml
          bundle: phosphor-x86_64.flatpak
          artifact-name: phosphor-x86_64.flatpak

  # After every upload: the tag's draft takes its public shape (docs/BUILD.md,
  # Release checklist). Edits the draft tauri-action opened, so one release per
  # tag. The notes are a skeleton; edit the TODO lines before Publish.
  release:
    needs: [windows-release, android-release, flatpak]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: phosphor-x86_64.flatpak
          path: flatpak
      - name: Public names, SHA256SUMS.txt, pre-release, notes skeleton
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=$GITHUB_REF_NAME v=${GITHUB_REF_NAME#v}
          # Public name of a CI asset; empty drops it (the .app.tar.gz, the old checksums).
          pub() {
            case "$1" in
              *_x64-setup.exe) echo "Phosphor-$v-windows-x64-setup.exe" ;;
              *_x64-portable.zip) echo "Phosphor-$v-windows-x64-portable.zip" ;;
              *_x64.msix) echo "Phosphor-$v-windows-x64.msix" ;;
              *_aarch64.dmg) echo "Phosphor-$v-macos-arm64.dmg" ;;
              *_amd64.AppImage) echo "Phosphor-$v-linux-x86_64.AppImage" ;;
              *_amd64.deb) echo "Phosphor-$v-linux-amd64.deb" ;;
              *_android-arm64.apk) echo "Phosphor-$v-android-arm64.apk" ;;
              *.app.tar.gz | SHA256SUMS.txt) ;;
              *) echo "$1" ;;
            esac
          }
          id=$(gh api "repos/$GH_REPO/releases" --jq "[.[] | select(.draft and .tag_name == \"$tag\")][0].id")
          mkdir rel && cd rel
          gh release download "$tag"
          gh api "repos/$GH_REPO/releases/$id/assets" --paginate --jq '.[] | "\(.id) \(.name)"' |
            while read -r aid name; do
              new=$(pub "$name")
              if [ -z "$new" ]; then
                gh api -X DELETE "repos/$GH_REPO/releases/assets/$aid"; rm -f "$name"
              elif [ "$new" != "$name" ]; then
                gh api -X PATCH "repos/$GH_REPO/releases/assets/$aid" -f name="$new" >/dev/null; mv "$name" "$new"
              fi
            done
          cp ../flatpak/phosphor-x86_64.flatpak "Phosphor-$v-linux-x86_64.flatpak"
          sha256sum Phosphor-* > SHA256SUMS.txt
          gh release upload "$tag" "Phosphor-$v-linux-x86_64.flatpak" SHA256SUMS.txt --clobber

          prev=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName')
          # ponytail: compare lists at most 250 commits; past that the list is cut short.
          changes=$(gh api "repos/$GH_REPO/compare/$prev...$tag" --jq '.commits[] | select(.parents | length == 1) | "- " + (.commit.message | split("\n")[0])')
          {
