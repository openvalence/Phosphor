          **Pre-release CI build.** These files come straight from the GitHub Actions run for commit `@SHA@` on `main`. Nobody has tested them on every platform. Expect rough edges.

          ## Try it with no machine

          Phosphor has a built-in virtual machine: Neutrino, the firmware emulator. It runs the same firmware code as the real machine, compiled to WebAssembly inside the app. It has patterns, planning and telemetry, but no motor, so nothing moves. Install Phosphor, open the Hubs list, and pick Neutrino, the one with the ν badge.

