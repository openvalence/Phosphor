# Phosphor bundles for Windows, macOS and Linux, plus a Flatpak built from
# the Linux .deb, and a Windows MSIX. A v* tag sends the Windows installer,
# MSIX and portable exe to SignPath (sign-release.yml fetches them once
# approved). docs/BUILD.md is the map.
# A v* tag also opens a draft release holding every bundle.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # the draft release on a tag
  actions: read # SignPath reads the job that produced the artifact

jobs:
  bundle:
    name: ${{ matrix.triple }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-latest
            triple: aarch64-apple-darwin
            bundles: app,dmg
          - os: ubuntu-22.04 # oldest glibc the AppImage and .deb support
            triple: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      # The sibling layout Phosphor builds against: Valence (the JS client),
      # Nucleus and Kinetic (the built-in machine's sources, pinned in
      # src/model/neutrino/neutrino.pin and vendored), ButtplugIO (Cargo path
      # deps), all beside Phosphor.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: Phosphor
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: openvalence/Nucleus
          path: Nucleus
      - name: Valence at Nucleus's valence.pin
        id: pin
        shell: bash
        run: echo "sha=$(tr -d '[:space:]' < Nucleus/valence.pin)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: openvalence/Valence
          ref: ${{ steps.pin.outputs.sha }}
          path: Valence
      - name: Kinetic at Nucleus's kinetic.pin
        id: kpin
        shell: bash
        run: echo "sha=$(tr -d '[:space:]' < Nucleus/kinetic.pin)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: openvalence/Kinetic
          ref: ${{ steps.kpin.outputs.sha }}
          path: Kinetic
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: openvalence/ButtplugIO
          ref: valence
          path: ButtplugIO

      - name: Linux packages (Tauri's GTK/WebKit, buttplug's udev/usb/dbus)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libudev-dev libusb-1.0-0-dev libdbus-1-dev

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Phosphor/package-lock.json
      - run: npm ci
        working-directory: Phosphor
      - name: Stamp the build version (docs/BUILD.md, Versioning)
        run: node tools/version.mjs --write
        working-directory: Phosphor
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: Phosphor/src-tauri -> target

      # macOS: ad-hoc signed ("-"), no Apple ID. Notarizing needs the APPLE_*
      # secrets (docs/BUILD.md).
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          projectPath: Phosphor
          args: --target ${{ matrix.triple }} --bundles ${{ matrix.bundles }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: Phosphor ${{ github.ref_name }}
          releaseDraft: true

      # The .app ships inside the .dmg: an artifact zip drops its exec bits.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: phosphor-${{ matrix.triple }}
          if-no-files-found: error
          path: |
            Phosphor/src-tauri/target/${{ matrix.triple }}/release/bundle/nsis/*.exe
            Phosphor/src-tauri/target/${{ matrix.triple }}/release/bundle/dmg/*.dmg
            Phosphor/src-tauri/target/${{ matrix.triple }}/release/bundle/deb/*.deb
            Phosphor/src-tauri/target/${{ matrix.triple }}/release/bundle/appimage/*.AppImage

      # The plain built exe: the frontend is embedded, no resources or sidecars.
      # It needs the WebView2 runtime. Named after the installer's version.
      - name: Portable exe
        if: runner.os == 'Windows'
        shell: bash
        working-directory: Phosphor/src-tauri/target/${{ matrix.triple }}/release
        run: |
          setup=$(ls bundle/nsis/Phosphor_*_x64-setup.exe)
          v=$(basename "$setup" | sed -E 's/^Phosphor_(.+)_x64-setup\.exe$/\1/')
          mkdir -p portable && cp phosphor.exe "portable/Phosphor_${v}_x64-portable.exe"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'Windows'
        with:
          name: phosphor-${{ matrix.triple }}-portable
          if-no-files-found: error
          path: Phosphor/src-tauri/target/${{ matrix.triple }}/release/portable/*.exe
      - name: Portable exe into the draft release
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: Phosphor/src-tauri/target/${{ matrix.triple }}/release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" portable/*.exe --clobber -R "${{ github.repository }}"

      # The sideload MSIX around the same exe. Its Publisher must equal the
      # signing certificate's subject (vars.MSIX_PUBLISHER); unsigned, it does
      # not install, so only the signed one goes into a release.
      - name: MSIX package
        if: runner.os == 'Windows'
        shell: bash
        working-directory: Phosphor
        env:
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
        run: |
          rel=src-tauri/target/${{ matrix.triple }}/release
          node tools/msix/pack.mjs --exe-dir "$rel"
          v=$(basename "$rel"/portable/*.exe | sed -E 's/^Phosphor_(.+)_x64-portable\.exe$/\1/')
          mkdir -p "$rel/msix" && cp src-tauri/target/msix/phosphor-x86_64.msix "$rel/msix/Phosphor_${v}_x64.msix"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'Windows'
        with:
          name: phosphor-${{ matrix.triple }}-msix
          if-no-files-found: error
          path: Phosphor/src-tauri/target/${{ matrix.triple }}/release/msix/*.msix

      # v* tag pushes only, and skipped until the SignPath variables exist
      # (docs/BUILD.md, Windows signing). Every request waits for a manual
      # approval, so the job submits and does not wait; sign-release.yml
      # fetches the signed files. The zip holds bundle/nsis/, portable/, msix/.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: tosign
        if: runner.os == 'Windows' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        with:
          name: phosphor-${{ matrix.triple }}-to-sign
          if-no-files-found: error
          path: |
            Phosphor/src-tauri/target/${{ matrix.triple }}/release/bundle/nsis/*-setup.exe
            Phosphor/src-tauri/target/${{ matrix.triple }}/release/portable/*.exe
            Phosphor/src-tauri/target/${{ matrix.triple }}/release/msix/*.msix
      - name: Signing request (SignPath)
        id: signpath
        if: steps.tosign.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.tosign.outputs.artifact-id }}
          wait-for-completion: false
      - name: Signing request in the job summary
        if: steps.signpath.outcome == 'success'
        shell: bash
        env:
          URL: ${{ steps.signpath.outputs.signing-request-web-url }}
          ID: ${{ steps.signpath.outputs.signing-request-id }}
        run: |
          {
            echo "Approve the signing request: $URL"
            echo
            echo "Then put the signed files into the draft release:"
            echo
            echo '```'
            echo "gh workflow run sign-release.yml -R $GITHUB_REPOSITORY -f tag=$GITHUB_REF_NAME -f signing-request-id=$ID"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  flatpak:
    needs: bundle
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: phosphor-x86_64-unknown-linux-gnu
          path: linux
      - name: Hand the .deb to the manifest; its name carries the build version
        run: |
          deb=$(ls linux/deb/*.deb); cp "$deb" flatpak/phosphor.deb
          v=$(basename "$deb" | sed -E 's/^Phosphor_([0-9.]+)_.*/\1/')
          sed -i -E "s|<release version=\"[^\"]+\" date=\"[^\"]+\"/>|<release version=\"$v\" date=\"$(date -u +%F)\"/>|" flatpak/org.openvalence.Phosphor.metainfo.xml
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: flatpak/org.openvalence.Phosphor.yml
          bundle: phosphor-x86_64.flatpak
          artifact-name: phosphor-x86_64.flatpak
