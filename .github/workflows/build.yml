          ## Known limits

          - Intel Macs aren't built. macOS builds aren't notarized.
          - The plugin API is version 1 and not frozen. A plugin runs with the page's full authority, so install only plugins you trust.
          - Layouts are stored on the device that made them and don't sync.
          - Nucleus firmware isn't released. Neutrino is the way in until the board ships.
          - Bugs and rough edges: [open an issue](https://github.com/openvalence/Phosphor/issues).

