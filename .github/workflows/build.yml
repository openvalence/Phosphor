# Phosphor bundles for Windows, macOS and Linux, each with its valencesim
# sidecar, plus a Flatpak built from the Linux .deb. SignPath signs the
# Windows installer outside pull requests. docs/BUILD.md is the map.
# A v* tag also opens a draft release holding every bundle.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # the draft release on a tag
  actions: read # SignPath reads the job that produced the artifact

jobs:
  bundle:
    name: ${{ matrix.triple }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-latest
            triple: aarch64-apple-darwin
            bundles: app,dmg
          - os: ubuntu-22.04 # oldest glibc the AppImage and .deb support
            triple: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      # The sibling layout Phosphor builds against: Valence (the JS client),
      # Nucleus (the sim), Kinetic (the sim's planner), ButtplugIO (Cargo path
      # deps), all beside Phosphor.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: Phosphor
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: openvalence/Nucleus
          path: Nucleus
      - name: Valence at Nucleus's valence.pin
        id: pin
        shell: bash
        run: echo "sha=$(tr -d '[:space:]' < Nucleus/valence.pin)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: openvalence/Valence
          ref: ${{ steps.pin.outputs.sha }}
          path: Valence
      - name: Kinetic at Nucleus's kinetic.pin
        id: kpin
        shell: bash
        run: echo "sha=$(tr -d '[:space:]' < Nucleus/kinetic.pin)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: openvalence/Kinetic
          ref: ${{ steps.kpin.outputs.sha }}
          path: Kinetic
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: openvalence/ButtplugIO
          ref: valence
          path: ButtplugIO

      # valencesim -> Phosphor/src-tauri/binaries/valencesim-<triple>[.exe]
      - name: Linux packages (GCC 13 for the sim, Tauri's GTK/WebKit, buttplug's udev/usb/dbus)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y g++-13 libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libudev-dev libusb-1.0-0-dev libdbus-1-dev
      - name: Build valencesim (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S Nucleus/sim/valencesim -B simbuild -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-13
          cmake --build simbuild --parallel
      - name: Build valencesim (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -S Nucleus/sim/valencesim -B simbuild -DCMAKE_BUILD_TYPE=Release
          cmake --build simbuild --parallel
      # Nucleus/lib/valence is a git symlink; a Windows checkout writes it as
      # a text file, so it becomes a junction here.
      - name: Link Nucleus/lib/valence (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item Nucleus/lib/valence -Force
          New-Item -ItemType Junction -Path Nucleus/lib/valence -Target "$PWD/Valence/lib/valence" | Out-Null
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          install: git mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
      - name: Build valencesim (Windows, MinGW-w64)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -S Nucleus/sim/valencesim -B simbuild -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build simbuild
      - name: Name the sidecar for Tauri
        shell: bash
        run: |
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=.exe
          mkdir -p Phosphor/src-tauri/binaries
          cp "simbuild/valencesim$ext" "Phosphor/src-tauri/binaries/valencesim-${{ matrix.triple }}$ext"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Phosphor/package-lock.json
      - run: npm ci
        working-directory: Phosphor
      - name: Stamp the build version (docs/BUILD.md, Versioning)
        run: node tools/version.mjs --write
        working-directory: Phosphor
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: Phosphor/src-tauri -> target

      # macOS: ad-hoc signed ("-"), no Apple ID. Notarizing needs the APPLE_*
      # secrets (docs/BUILD.md).
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          projectPath: Phosphor
          args: --target ${{ matrix.triple }} --bundles ${{ matrix.bundles }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: Phosphor ${{ github.ref_name }}
          releaseDraft: true

      # The .app ships inside the .dmg: an artifact zip drops its exec bits.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: phosphor-${{ matrix.triple }}
          if-no-files-found: error
          path: |
            Phosphor/src-tauri/target/${{ matrix.triple }}/release/bundle/nsis/*.exe
            Phosphor/src-tauri/target/${{ matrix.triple }}/release/bundle/dmg/*.dmg
            Phosphor/src-tauri/target/${{ matrix.triple }}/release/bundle/deb/*.deb
            Phosphor/src-tauri/target/${{ matrix.triple }}/release/bundle/appimage/*.AppImage

      # Skipped, not failed, until the SignPath variables exist (docs/BUILD.md,
      # Windows signing). The artifact zip holds nsis/<installer>.exe.
      - name: Sign the installer (SignPath)
        if: runner.os == 'Windows' && github.event_name != 'pull_request' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'Windows' && github.event_name != 'pull_request' && vars.SIGNPATH_ORGANIZATION_ID != ''
        with:
          name: phosphor-${{ matrix.triple }}-signed
          if-no-files-found: error
          path: signed/nsis/*.exe
      # Same file name, so the signed installer replaces the unsigned one.
      - name: Signed installer into the draft release
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" signed/nsis/*.exe --clobber -R "${{ github.repository }}"

  flatpak:
    needs: bundle
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: phosphor-x86_64-unknown-linux-gnu
          path: linux
      - name: Hand the .deb to the manifest; its name carries the build version
        run: |
          deb=$(ls linux/deb/*.deb); cp "$deb" flatpak/phosphor.deb
          v=$(basename "$deb" | sed -E 's/^Phosphor_([0-9.]+)_.*//')
          sed -i -E "s|<release version=\"[^\"]+\" date=\"[^\"]+\"/>|<release version=\"$v\" date=\"$(date -u +%F)\"/>|" flatpak/org.openvalence.Phosphor.metainfo.xml
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: flatpak/org.openvalence.Phosphor.yml
          bundle: phosphor-x86_64.flatpak
          artifact-name: phosphor-x86_64.flatpak
