          ## What's in it

          - The Dash: a grid you arrange from a palette of knobs, sliders, graphs and readouts, saved as named layouts.
          - A page for every setting a machine declares, built from its catalog at connect time.
          - E-Stop and Pause in a top strip that can't be hidden.
          - A funscript player, a node editor, and plugins (five ship with the app).
          - A Buttplug.io server on 127.0.0.1:12345, off until you start it.
          - 20 themes, and health lines that name a measured cause and one action.

          ## Which file

          | Your system | File |
          |---|---|
          | Windows 10/11, 64-bit | `Phosphor-@V@-windows-x64.msix` (double-click to install) |
          | Windows 10/11, classic installer | `Phosphor-@V@-windows-x64-setup.exe` |
          | Windows 10/11, no install | `Phosphor-@V@-windows-x64-portable.zip` (extract it, then run `Phosphor\phosphor.exe`) |
          | Mac with Apple silicon | `Phosphor-@V@-macos-arm64.dmg` |
          | Linux, runs anywhere | `Phosphor-@V@-linux-x86_64.AppImage` (`chmod +x`, then run it) |
          | Linux, Debian or Ubuntu | `Phosphor-@V@-linux-amd64.deb` |
          | Linux, Flatpak | `Phosphor-@V@-linux-x86_64.flatpak` (`flatpak install --user ./Phosphor-@V@-linux-x86_64.flatpak`, needs the Flathub remote for the GNOME runtime) |
          | Android 8 and later, arm64 | `Phosphor-@V@-android-arm64.apk` |

          Phosphor draws with the Microsoft Edge WebView2 Runtime, which Windows 10 and 11 include. Older Windows needs it installed first.

          ## Opening it

          - **Windows:** the installer, the MSIX and the portable exe are signed by Grayson Heath. SmartScreen can still show "Windows protected your PC" while a new release builds download reputation. More info on that screen shows the publisher.
          - **macOS:** the app is ad-hoc signed and not notarized. Open the .dmg, drag Phosphor to Applications, then right-click it and choose Open. If macOS still refuses, go to System Settings > Privacy & Security and choose Open Anyway.
          - **Android:** allow "Install unknown apps" for your browser or file manager, then open the APK. Updates install over it when they're signed with the same key. Signing certificate SHA-256: `1F:D3:62:C0:8B:EE:8A:19:33:26:F1:E5:9E:4C:D6:48:73:98:4E:D6:B8:3F:75:FD:D6:A1:3A:35:00:FF:98:74` (check with `apksigner verify --print-certs`).

