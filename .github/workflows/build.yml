# Phosphor bundles for Windows, macOS and Linux, each with its valencesim
# sidecar, plus a Flatpak built from the Linux .deb. docs/BUILD.md is the map.
# A v* tag also opens a draft release holding every bundle.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # the draft release on a tag

jobs:
  bundle:
    name: ${{ matrix.triple }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-latest
            triple: aarch64-apple-darwin
            bundles: app,dmg
          - os: ubuntu-22.04 # oldest glibc the AppImage and .deb support
            triple: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      # The sibling layout Phosphor builds against: Valence (the JS client),
      # Nucleus (the sim), ButtplugIO (Cargo path deps), all beside Phosphor.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: Phosphor
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openvalence/Nucleus
          path: Nucleus
      - name: Valence at Nucleus's valence.pin
        id: pin
        shell: bash
        run: echo "sha=$(tr -d '[:space:]' < Nucleus/valence.pin)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openvalence/Valence
          ref: ${{ steps.pin.outputs.sha }}
          path: Valence
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openvalence/ButtplugIO
          ref: valence
          path: ButtplugIO

      # valencesim -> Phosphor/src-tauri/binaries/valencesim-<triple>[.exe]
      - name: Linux packages (GCC 13 for the sim, Tauri's GTK/WebKit, buttplug's udev/usb/dbus)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y g++-13 libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libudev-dev libusb-1.0-0-dev libdbus-1-dev
      - name: Build valencesim (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S Nucleus/sim/valencesim -B simbuild -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-13
          cmake --build simbuild --parallel
      - name: Build valencesim (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -S Nucleus/sim/valencesim -B simbuild -DCMAKE_BUILD_TYPE=Release
          cmake --build simbuild --parallel
      # Nucleus/lib/valence is a git symlink; a Windows checkout writes it as
      # a text file, so it becomes a junction here.
      - name: Link Nucleus/lib/valence (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item Nucleus/lib/valence -Force
          New-Item -ItemType Junction -Path Nucleus/lib/valence -Target "$PWD/Valence/lib/valence" | Out-Null
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          install: git mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
      - name: Build valencesim (Windows, MinGW-w64)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -S Nucleus/sim/valencesim -B simbuild -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build simbuild
      - name: Name the sidecar for Tauri
        shell: bash
        run: |
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=.exe
          mkdir -p Phosphor/src-tauri/binaries
          cp "simbuild/valencesim$ext" "Phosphor/src-tauri/binaries/valencesim-${{ matrix.triple }}$ext"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Phosphor/package-lock.json
      - run: npm ci
        working-directory: Phosphor
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: Phosphor/src-tauri -> target

      # macOS: ad-hoc signed ("-"), no Apple ID. Notarizing needs the APPLE_*
      # secrets (docs/BUILD.md).
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          projectPath: Phosphor
          args: --target ${{ matrix.triple }} --bundles ${{ matrix.bundles }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: Phosphor ${{ github.ref_name }}
          releaseDraft: true

      # The .app ships inside the .dmg: an artifact zip drops its exec bits.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phosphor-${{ matrix.triple }}
          if-no-files-found: error
          path: |
            Phosphor/src-tauri/target/${{ matrix.triple }}/release/bundle/nsis/*.exe
            Phosphor/src-tauri/target/${{ matrix.triple }}/release/bundle/dmg/*.dmg
            Phosphor/src-tauri/target/${{ matrix.triple }}/release/bundle/deb/*.deb
            Phosphor/src-tauri/target/${{ matrix.triple }}/release/bundle/appimage/*.AppImage

  flatpak:
    needs: bundle
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: phosphor-x86_64-unknown-linux-gnu
          path: linux
      - name: Hand the .deb to the manifest
        run: cp linux/deb/*.deb flatpak/phosphor.deb
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: flatpak/org.openvalence.Phosphor.yml
          bundle: phosphor-x86_64.flatpak
          artifact-name: phosphor-x86_64.flatpak
