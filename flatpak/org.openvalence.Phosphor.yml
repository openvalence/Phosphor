# Phosphor as a Flatpak, packaged from the Linux .deb CI's ubuntu-22.04 job
# builds (the Tauri binary and its valencesim sidecar). CI copies that .deb
# here as phosphor.deb before flatpak-builder runs.
#
# Runtime is GNOME, not bare freedesktop: webkit2gtk-4.1 ships only in the
# GNOME runtime. GNOME 50 sits on freedesktop 25.08.
#
# Not built from source in-manifest: flatpak-builder's sandbox is offline, so
# that needs every crate and npm package vendored plus the sibling repos as
# sources. The .deb route is what works today.
app-id: org.openvalence.Phosphor
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: phosphor
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # Hubs over WebSocket, UDP discovery, the datagram e-stop, the sidecar on loopback.
  - --share=network
  # Serial and HID toys through the embedded buttplug server; covers the GPU (dri) too.
  - --device=all
  # BLE through BlueZ.
  - --system-talk-name=org.bluez
modules:
  - name: phosphor
    buildsystem: simple
    sources:
      - type: file
        path: phosphor.deb
      - type: file
        path: org.openvalence.Phosphor.desktop
      - type: file
        path: org.openvalence.Phosphor.metainfo.xml
    build-commands:
      - ar -x phosphor.deb
      - tar -xf data.tar.gz
      # Tauri resolves the sidecar beside its own binary: both stay in /app/bin.
      - install -Dm755 -t /app/bin usr/bin/phosphor usr/bin/valencesim
      - install -Dm644 usr/share/icons/hicolor/128x128/apps/phosphor.png /app/share/icons/hicolor/128x128/apps/org.openvalence.Phosphor.png
      - install -Dm644 -t /app/share/applications org.openvalence.Phosphor.desktop
      - install -Dm644 -t /app/share/metainfo org.openvalence.Phosphor.metainfo.xml
